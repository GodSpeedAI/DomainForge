# cargo-audit configuration.
#
# Every ignored advisory below is reviewed and carries an explicit reason plus
# the condition under which the ignore must be lifted. An ignore is NOT a fix;
# it is a documented, time-boxed acceptance of an advisory that cannot yet be
# remediated.

[advisories]
ignore = [
    # quick-xml < 0.41 — DoS via NsReader (quadratic duplicate-attribute check
    # and unbounded namespace-declaration allocation) on untrusted XML.
    #
    # Reach in DomainForge: quick-xml is pulled ONLY through the OPTIONAL
    # `shacl` feature (oxigraph -> sparesults -> quick-xml 0.28.2; oxigraph ->
    # rio_xml -> quick-xml 0.36.2). No shipped build enables `shacl`: the
    # default, `cli`, `wasm`, `python`, and `typescript` feature sets all omit
    # it, so the vulnerable code is never compiled into a published artifact.
    #
    # Threat model: DomainForge is a local CLI/architecture tooling. The
    # affected RDF/XML import path consumes user-supplied local files, not
    # network-untrusted input, so the DoS surface is negligible (a user can
    # only DoS themselves).
    #
    # Why not fixed: upstream-blocked. The latest oxigraph line that DomainForge
    # can use still resolves quick-xml to 0.28.2 / 0.36.2; sparesults 0.3.x and
    # rio_xml pin `quick-xml = "^0.28"` / `"^0.36"`, neither of which can reach
    # 0.41. Bumping oxigraph to 0.4/0.5 does not help: those route through
    # oxrdfxml 0.2.x, which pins `quick-xml = "^0.37"` — still below 0.41.
    #
    # Lift these ignores when oxigraph/oxrdfxml publishes a release built
    # against quick-xml >= 0.41, then bump oxigraph and remove both entries.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",

    # rkyv 0.7.46 — insufficient archive validation can cause out-of-bounds
    # reads when deserializing an rkyv archive containing Rc/Arc.
    #
    # Reach in DomainForge: rkyv is pulled ONLY through rust_decimal's
    # OPTIONAL "rkyv" Cargo feature. domainforge-core depends on rust_decimal
    # with `features = ["serde"]` only — "rkyv" is never enabled by any
    # shipped feature set (default, cli, wasm, python, typescript). Confirmed
    # via `cargo tree --all-features -i rkyv` and `cargo metadata
    # --all-features`: rkyv has zero live dependents in the resolved graph.
    # It remains in Cargo.lock only because Cargo pre-resolves every
    # optional dependency a manifest declares, for lockfile stability across
    # future feature toggles — not because it is compiled into any build.
    #
    # Threat model: the advisory is about deserializing an untrusted rkyv
    # archive. DomainForge never constructs or deserializes an rkyv archive
    # anywhere in its own code; the dependency is dead weight in the lock
    # graph, not reachable code.
    #
    # Why not fixed: upstream-blocked. rust_decimal 1.42.1 pins its optional
    # dependency to `rkyv = "0.7.46"` exactly; the fix (>=0.8.17) is a
    # breaking rewrite rust_decimal has not adopted, so no available
    # rust_decimal 1.x release can move this pin.
    #
    # Lift this ignore when rust_decimal publishes a release depending on
    # rkyv >= 0.8.17, then run `cargo update -p rkyv` and remove this entry.
    "RUSTSEC-2026-0235",
]
