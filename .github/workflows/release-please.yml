name: Release Please

# Conventional commits are collected into one repository-level release.
# Merging the Release Please PR creates one vX.Y.Z tag and one GitHub Release.
on:
  push:
    branches: [main]

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071
        with:
          # Use the PAT so a tag created by Release Please emits the downstream
          # push event consumed by deploy.yml. Refs created with GITHUB_TOKEN do
          # not trigger another workflow.
          token: ${{ secrets.CREATE_PR_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Normalize GitHub Release title to tag
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: gh release edit "$TAG_NAME" --title "$TAG_NAME"
