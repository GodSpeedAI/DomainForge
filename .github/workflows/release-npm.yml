name: Release NPM

on:
  workflow_call:
  workflow_dispatch:

# npm Trusted Publishing exchanges GitHub's OIDC identity for a short-lived
# publish credential. No npm write token is stored in GitHub.
permissions:
  contents: read
  id-token: write

jobs:
  # Build and smoke-test every platform before anything is published.
  build:
    name: Build and smoke-test platform packages
    uses: ./.github/workflows/npm-platforms.yml
    permissions:
      contents: read

  publish:
    name: Publish napi bindings to npm
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install OIDC-capable npm
        run: npm install -g npm@^11.15.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: npm-platform-*
          path: tarballs
          merge-multiple: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-main
          path: tarballs

      # Platform packages go first so the main package's optionalDependencies
      # always resolve the moment it appears on the registry.
      # NPM_TOKEN bootstraps packages that do not exist yet: npm trusted
      # publishing can only be configured on an existing package. Once a
      # trusted publisher is set for each platform package this token is unused.
      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          ls tarballs
          count=$(ls tarballs/godspeedai-domainforge-[a-z]*-*.tgz | wc -l)
          if [ "$count" -ne 5 ]; then echo "::error::expected 5 platform tarballs, found $count"; exit 1; fi
          # "./" keeps npm from reading "tarballs/<file>" as a GitHub user/repo spec.
          for tgz in tarballs/godspeedai-domainforge-[a-z]*-*.tgz; do
            name=$(tar -xzOf "$tgz" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).name")
            version=$(tar -xzOf "$tgz" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published, skipping"
              continue
            fi
            npm publish "./$tgz" --access public --provenance --ignore-scripts
          done

      - name: Publish main package
        run: |
          set -euo pipefail
          tgz=$(ls tarballs/godspeedai-domainforge-[0-9]*.tgz)
          version=$(tar -xzOf "$tgz" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          if npm view "@godspeedai/domainforge@$version" version >/dev/null 2>&1; then
            echo "Already published, skipping"
            exit 0
          fi
          npm publish "./$tgz" --access public --provenance --ignore-scripts

  publish-wasm:
    name: Publish WASM package to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install OIDC-capable npm
        run: npm install -g npm@^11.15.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build WASM package
        run: |
          cd domainforge-core
          wasm-pack build --target web --release -- --features wasm
          node - <<'NODE'
          const fs = require('fs');
          const pkgPath = 'pkg/package.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.name = '@godspeedai/domainforge-wasm';
          pkg.files = ['domainforge_core.js', 'domainforge_core.d.ts', 'domainforge_core_bg.wasm', 'domainforge_core_bg.wasm.d.ts'];
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: WASM smoke test
        run: |
          cd domainforge-core/pkg
          for f in domainforge_core.js domainforge_core.d.ts domainforge_core_bg.wasm domainforge_core_bg.wasm.d.ts package.json; do
            test -f "$f" || { echo "ERROR: missing $f in WASM pkg"; exit 1; }
          done
          node -e "const p=require('./package.json'); if (p.name !== '@godspeedai/domainforge-wasm') throw new Error('Unexpected package name: ' + p.name); ['version','main','types'].forEach(k => { if(!p[k]) throw new Error('Missing field: ' + k) })"
          echo "WASM smoke test passed"

      - name: Check if WASM already published
        working-directory: domainforge-core/pkg
        run: |
          if npm view "@godspeedai/domainforge-wasm@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
            echo "Already published, skipping"
            echo "SKIP_PUBLISH=1" >> "$GITHUB_ENV"
          fi

      - name: Publish WASM to npm with OIDC
        if: env.SKIP_PUBLISH != '1'
        working-directory: domainforge-core/pkg
        run: npm publish --access public
