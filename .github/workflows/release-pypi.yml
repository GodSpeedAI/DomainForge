name: Release PyPI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-sdist:
    name: Publish sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Decrypt secrets
        id: secrets
        uses: ./.github/actions/decrypt-secrets
        with:
          sops-age-key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - name: Install maturin
        run: pip install maturin==1.10.1

      # Publish the sdist FIRST, before any wheel job, so the wheel matrix's
      # maturin publish sees the sdist already exists and skips it cleanly
      # (--skip-existing) instead of racing on the concurrent first upload.
      - name: Publish sdist
        working-directory: domainforge-python
        run: python -m maturin publish --features python --target x86_64-unknown-linux-gnu --skip-existing
        env:
          MATURIN_PYPI_TOKEN: ${{ steps.secrets.outputs.pypi-api-token || secrets.PYPI_API_TOKEN }}

  build-and-publish:
    name: Publish Wheels (${{ matrix.os }}, ${{ matrix.target }})
    needs: build-sdist
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.11
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, python-version: "3.11" }
          - { os: macos-15-intel, target: x86_64-apple-darwin, python-version: "3.11" }
          - { os: windows-2025-vs2026, target: x86_64-pc-windows-msvc, python-version: "3.11" }
          - { os: macos-15, target: aarch64-apple-darwin, python-version: "3.11" }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, python-version: "3.11", manylinux: "2_28" }
          # Python 3.12
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, python-version: "3.12" }
          - { os: macos-15-intel, target: x86_64-apple-darwin, python-version: "3.12" }
          - { os: windows-2025-vs2026, target: x86_64-pc-windows-msvc, python-version: "3.12" }
          - { os: macos-15, target: aarch64-apple-darwin, python-version: "3.12" }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, python-version: "3.12", manylinux: "2_28" }
          # Python 3.13
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, python-version: "3.13" }
          - { os: macos-15-intel, target: x86_64-apple-darwin, python-version: "3.13" }
          - { os: windows-2025-vs2026, target: x86_64-pc-windows-msvc, python-version: "3.13" }
          - { os: macos-15, target: aarch64-apple-darwin, python-version: "3.13" }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, python-version: "3.13", manylinux: "2_28" }
    steps:
      - uses: actions/checkout@v6

      - name: Decrypt secrets
        id: secrets
        uses: ./.github/actions/decrypt-secrets
        with:
          sops-age-key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Ensure Rust target is installed
        run: rustup target add ${{ matrix.target }}

      - name: Install maturin
        run: pip install maturin==1.10.1

      - name: Build and publish wheels (native)
        if: matrix.manylinux == ''
        shell: bash
        working-directory: domainforge-python
        run: |
          python -m maturin publish \
            --features python \
            --target ${{ matrix.target }} \
            --skip-existing
        env:
          MATURIN_PYPI_TOKEN: ${{ steps.secrets.outputs.pypi-api-token || secrets.PYPI_API_TOKEN }}

      # aarch64 Linux is cross-compiled in maturin's manylinux cross container
      # (gcc toolchain). Zig 0.11 rejected the --fix-cortex-a53-843419 linker
      # arg that Rust passes for aarch64, which broke the 0.21.0 and 0.21.1 wheels.
      - name: Build wheels (manylinux cross container)
        if: matrix.manylinux != ''
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: domainforge-python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          maturin-version: 1.10.1
          rust-toolchain: 1.99.0
          args: --release --features python --out dist -i python${{ matrix.python-version }}

      - name: Publish wheels (manylinux cross container)
        if: matrix.manylinux != ''
        shell: bash
        working-directory: domainforge-python
        run: python -m maturin upload --skip-existing dist/*.whl
        env:
          MATURIN_PYPI_TOKEN: ${{ steps.secrets.outputs.pypi-api-token || secrets.PYPI_API_TOKEN }}
