name: npm platform packages

# Builds the napi binding natively on every supported platform, packs one npm
# package per platform plus the main package, and smoke-tests each platform by
# installing the packed tarballs into a clean directory and calling the API.
# This workflow never publishes. release-npm.yml publishes its artifacts, and
# ci.yml runs it on pull requests.
on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc targets build natively on ubuntu 22.04 (glibc 2.35), the
          # oldest baseline we support (Jetson / Ubuntu 22.04).
          - { name: linux-x64-gnu, runner: ubuntu-22.04 }
          - { name: linux-arm64-gnu, runner: ubuntu-22.04-arm }
          - { name: darwin-arm64, runner: macos-15 }
          - { name: darwin-x64, runner: macos-15-intel }
          - { name: win32-x64-msvc, runner: windows-latest }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@92e73e19cbfb3981e63ef478a16f95f415e634d3 # 1.99.0
        with:
          toolchain: 1.99.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build native binding
        working-directory: domainforge-typescript
        run: bun run build

      - name: Generate platform package manifests
        working-directory: domainforge-typescript
        run: bun run create-npm-dirs

      - name: Stage the .node into its platform package
        run: |
          dir=$(node scripts/npm_platform_packages.mjs stage)
          test "$(basename "$dir")" = "${{ matrix.name }}" || { echo "::error::built $dir, expected ${{ matrix.name }}"; exit 1; }

      - name: Pack the platform package
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cd "domainforge-typescript/npm/${{ matrix.name }}"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/out"
          ls -l "$RUNNER_TEMP/out"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-platform-${{ matrix.name }}
          path: ${{ runner.temp }}/out/*.tgz
          if-no-files-found: error

      # The loader (index.js) and declarations are generated by `napi build`
      # at the current version; the main package ships exactly those.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.name == 'linux-x64-gnu'
        with:
          name: npm-loader
          path: |
            domainforge-typescript/index.js
            domainforge-typescript/index.d.ts
          if-no-files-found: error

  pack-main:
    name: pack main package
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-loader
          path: domainforge-typescript

      - name: Add optionalDependencies on every platform package and pack
        run: |
          (cd domainforge-typescript && bun run create-npm-dirs)
          node scripts/npm_platform_packages.mjs inject-optional
          mkdir -p "$RUNNER_TEMP/out"
          (cd domainforge-typescript && npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/out")
          node scripts/npm_platform_packages.mjs verify-main "$RUNNER_TEMP/out"/godspeedai-domainforge-*.tgz

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-main
          path: ${{ runner.temp }}/out/*.tgz
          if-no-files-found: error

  smoke:
    name: smoke ${{ matrix.name }}
    needs: [build, pack-main]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64-gnu, runner: ubuntu-22.04 }
          - { name: linux-arm64-gnu, runner: ubuntu-22.04-arm }
          - { name: darwin-arm64, runner: macos-15 }
          - { name: darwin-x64, runner: macos-15-intel }
          - { name: win32-x64-msvc, runner: windows-latest }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-platform-${{ matrix.name }}
          path: tarballs

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-main
          path: tarballs

      # Install the packed platform tarball and the packed main tarball into a
      # clean directory, then require the package and call a real API. The
      # checkout holds no .node, so only the platform package can satisfy it.
      - name: Smoke test packed tarballs
        run: |
          set -euo pipefail
          ls tarballs
          node scripts/npm_platform_packages.mjs smoke \
            "tarballs/godspeedai-domainforge-${{ matrix.name }}-"*.tgz \
            tarballs/godspeedai-domainforge-[0-9]*.tgz
