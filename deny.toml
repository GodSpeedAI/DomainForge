[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "wasm32-unknown-unknown",
]
all-features = true

[advisories]
unmaintained = "workspace"
unsound = "all"
ignore = [
  # quick-xml 0.37.5 is pinned by oxigraph 0.5.x (oxrdfxml, sparesults); no release with
  # quick-xml >= 0.41 exists (oxigraph 0.5.13 is the latest). Impact is DoS only, on RDF/XML
  # and SPARQL XML results parsed by the optional `shacl` feature. Remove once oxigraph bumps.
  { id = "RUSTSEC-2026-0194", reason = "quick-xml pinned by oxigraph; no fix reachable; DoS only, optional shacl feature" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml pinned by oxigraph; no fix reachable; DoS only, optional shacl feature" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "BSL-1.0",
  "CC0-1.0",
  "MIT-0",
  "Zlib",
  "MPL-2.0",
  "Apache-2.0 WITH LLVM-exception",
]
exceptions = [
  # oxrocksdb-sys is dual-licensed GPL-2.0 OR Apache-2.0; we use it under Apache-2.0
  { allow = ["GPL-2.0"], crate = "oxrocksdb-sys" },
]
